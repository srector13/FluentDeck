# XcodeGen spec — generate the project with:  xcodegen generate
# Then open FluentDeck.xcodeproj, set your team, and run on the iPad.
name: FluentDeck
options:
  bundleIdPrefix: PolarReality
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FluentDeck:
    type: application
    platform: iOS
    sources:
      - FluentDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: PolarReality.FluentDeck   # Feather can re-sign under another ID
        TARGETED_DEVICE_FAMILY: "1,2"                   # designed for iPad; runs on iPhone too
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""                            # your Apple Developer team ID
        CODE_SIGN_STYLE: Automatic
    info:
      path: FluentDeck/Info.plist
      properties:
        CFBundleDisplayName: FluentDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        # Bonjour discovery of the PC and plain ws:// on the LAN.
        NSLocalNetworkUsageDescription: FluentDeck finds and controls your Windows PC on your home network.
        NSBonjourServices:
          - _fluentdeck._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false

  # Screenshot tests: drive the app against the DevHost (see .github/workflows/ci.yml).
  FluentDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FluentDeckUITests
    dependencies:
      - target: FluentDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: PolarReality.FluentDeck.UITests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FluentDeck

schemes:
  FluentDeck:
    build:
      targets:
        FluentDeck: all
        FluentDeckUITests: [test]
    test:
      config: Debug
      targets:
        - FluentDeckUITests
    archive:
      config: Release
